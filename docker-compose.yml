services:
  core-db:
    image: postgres:15-alpine
    container_name: core-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: banking_db
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  account-service:
    build: ./account-service
    container_name: account-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://core-db:5432/banking_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    ports:
      - "8080:8080"
    depends_on:
      core-db:
        condition: service_healthy
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    container_name: transaction-service
    environment:
      - ACCOUNT_SERVICE_URL=http://account-service:8080
    ports:
      - "8081:8081"
    depends_on:
      - account-service
    networks:
      - banking-network

volumes:
  pg-data:

networks:
  banking-network:
    driver: bridge
